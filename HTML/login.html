<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موّجه - تسجيل الدخول</title>
    <link rel="icon" type="image/png" href="../LogoIcon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@500;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../CSS/login.css">
</head>

<body>

    <header class="top-navigation">
        <a href="index.html" class="logo" aria-label="موّجه">
            <span class="logo-mark">م</span>
            <span class="logo-text">موّجه</span>
        </a>

        <a href="index.html" class="home-link">الرئيسية</a>
    </header>

    <main class="auth-page">
        <section class="auth-card">

            <div class="auth-header">
                <div class="auth-icon">
                    <span>م</span>
                </div>
                <h1 id="authTitle">تسجيل الدخول</h1>
                <p id="authSubtitle">سجّل دخولك للوصول إلى حسابك ونتائجك.</p>
            </div>

            <div class="auth-tabs" role="tablist" aria-label="نوع الحساب">
                <button type="button" class="auth-tab active" id="loginTab">تسجيل الدخول</button>
                <button type="button" class="auth-tab" id="signupTab">إنشاء حساب</button>
            </div>

            <div id="messageBox" class="message-box" hidden></div>

            <!-- LOGIN -->
            <form id="loginForm" class="auth-form" novalidate>

                <div class="form-group">
                    <label for="loginEmail">البريد الإلكتروني</label>
                    <input id="loginEmail" name="email" type="email" autocomplete="email"
                        placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password"
                            placeholder="أدخل كلمة المرور" required>
                        <button type="button" class="password-toggle" data-target="loginPassword">إظهار</button>
                    </div>
                </div>

                <button type="button" class="forgot-password" id="forgotPasswordButton">
                    نسيت كلمة المرور؟
                </button>

                <button type="submit" class="submit-button" id="loginSubmit">
                    تسجيل الدخول
                </button>
            </form>

            <!-- SIGNUP -->
            <form id="signupForm" class="auth-form" hidden novalidate>

                <div class="form-group">
                    <label for="signupName">الاسم</label>
                    <input id="signupName" name="name" type="text" autocomplete="name" placeholder="أدخل اسمك" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">البريد الإلكتروني</label>
                    <input id="signupEmail" name="email" type="email" autocomplete="email"
                        placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input id="signupPassword" name="password" type="password" autocomplete="new-password"
                            placeholder="6 أحرف على الأقل" minlength="6" required>
                        <button type="button" class="password-toggle" data-target="signupPassword">إظهار</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupConfirmPassword">تأكيد كلمة المرور</label>
                    <div class="password-wrapper">
                        <input id="signupConfirmPassword" name="confirmPassword" type="password"
                            autocomplete="new-password" placeholder="أعد كتابة كلمة المرور" minlength="6" required>
                        <button type="button" class="password-toggle" data-target="signupConfirmPassword">إظهار</button>
                    </div>
                </div>

                <button type="submit" class="submit-button" id="signupSubmit">
                    إنشاء الحساب
                </button>
            </form>

        </section>
    </main>

    <!-- VERIFICATION MODAL -->
    <div class="modal-overlay" id="verificationModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="verificationTitle">
            <button type="button" class="modal-close" data-close-modal aria-label="إغلاق">×</button>

            <div class="modal-icon">✉</div>
            <h2 id="verificationTitle">تأكيد البريد الإلكتروني</h2>
            <p id="verificationDescription">
                أرسلنا رمزاً مكوناً من 6 أرقام إلى بريدك الإلكتروني.
            </p>

            <div class="code-inputs" dir="ltr">
                <input maxlength="1" inputmode="numeric" autocomplete="one-time-code">
                <input maxlength="1" inputmode="numeric">
                <input maxlength="1" inputmode="numeric">
                <input maxlength="1" inputmode="numeric">
                <input maxlength="1" inputmode="numeric">
                <input maxlength="1" inputmode="numeric">
            </div>

            <button type="button" class="submit-button" id="verifyCodeButton">
                تأكيد الرمز
            </button>

            <button type="button" class="resend-button" id="resendCodeButton">
                إعادة إرسال الرمز
            </button>

            <div class="modal-message" id="verificationMessage" hidden></div>
        </div>
    </div>

    <!-- RESET PASSWORD MODAL -->
    <div class="modal-overlay" id="resetModal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="resetTitle">
            <button type="button" class="modal-close" data-close-modal aria-label="إغلاق">×</button>

            <div class="modal-icon">🔐</div>
            <h2 id="resetTitle">استعادة كلمة المرور</h2>
            <p id="resetDescription">
                أدخل بريدك الإلكتروني لإرسال رمز التحقق.
            </p>

            <div class="reset-step" id="resetEmailStep">
                <div class="form-group">
                    <label for="resetEmail">البريد الإلكتروني</label>
                    <input id="resetEmail" type="email" placeholder="أدخل بريدك الإلكتروني">
                </div>

                <button type="button" class="submit-button" id="sendResetCodeButton">
                    إرسال الرمز
                </button>
            </div>

            <div class="reset-step" id="resetCodeStep" hidden>
                <div class="code-inputs" dir="ltr" id="resetCodeInputs">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                    <input maxlength="1" inputmode="numeric">
                </div>

                <div class="form-group">
                    <label for="newPassword">كلمة المرور الجديدة</label>
                    <input id="newPassword" type="password" minlength="6" placeholder="6 أحرف على الأقل">
                </div>

                <div class="form-group">
                    <label for="newPasswordConfirm">تأكيد كلمة المرور الجديدة</label>
                    <input id="newPasswordConfirm" type="password" minlength="6" placeholder="أعد كتابة كلمة المرور">
                </div>

                <button type="button" class="submit-button" id="resetPasswordButton">
                    تحديث كلمة المرور
                </button>
            </div>

            <div class="modal-message" id="resetMessage" hidden></div>
        </div>
    </div>

    <script src="../JS/login.js"></script>
</body>

</html>
