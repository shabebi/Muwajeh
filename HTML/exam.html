<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار التوجيه | موّجه</title>
    <link rel="icon" type="image/png" href="../LogoIcon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome Free -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <link rel="stylesheet" href="../CSS/exam.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-navigation">

        <a href="index.html" class="logo" aria-label="موّجه">
            <img src="../Logo.png" alt="موّجه">
        </a>

        <nav class="navigation-links" aria-label="التنقل الرئيسي">

            <a href="index.html" class="nav-link">
                الرئيسية
            </a>

            <a href="test.html" class="nav-link active">
                اختبار التوجيه
            </a>

            <a href="universities.html" class="nav-link">
                الجامعات
            </a>

            <a href="majors.html" class="nav-link">
                التخصصات
            </a>

            <a href="about.html" class="nav-link">
                عن المنصة
            </a>

        </nav>

        <a href="login.html" class="login-button">
            تسجيل الدخول
        </a>

    </header>


    <!-- ================= EXAM ================= -->

    <main class="exam-main">

        <section class="question-card">

            <div class="question-glow"></div>

            <div class="question-container">

                <!-- Category -->
                <div class="category-pill">
                    <span>الأسئلة</span>
                    <i class="fa-regular fa-circle-question"></i>
                </div>


                <!-- Question -->
                <div class="question-heading">

                    <h1 id="questionText">
                        أجد متعة كبيرة في تحليل البيانات ومعالجة المشكلات الرقمية
                        والمعقدة التي تتطلب تفكيراً منطقياً متسلسلاً.
                    </h1>

                </div>


                <p class="question-description">
                    اختر الدرجة التي تعبّر عن مدى انطباق العبارة عليك.
                </p>


                <!-- Likert -->
                <div class="likert-scale" id="likertScale">

                    <button class="answer-option" type="button" data-value="1">
                        <span class="radio-circle"></span>
                        <span>لا تنطبق إطلاقاً</span>
                    </button>

                    <button class="answer-option" type="button" data-value="2">
                        <span class="radio-circle"></span>
                        <span>لا تنطبق غالباً</span>
                    </button>

                    <button class="answer-option" type="button" data-value="3">
                        <span class="radio-circle"></span>
                        <span>محايد</span>
                    </button>

                    <button class="answer-option" type="button" data-value="4">
                        <span class="radio-circle"></span>
                        <span>تنطبق غالباً</span>
                    </button>

                    <button class="answer-option selected" type="button" data-value="5">
                        <span class="radio-circle"></span>
                        <span>تنطبق عليّ بشدة</span>
                    </button>

                </div>


                <!-- Navigation -->
                <div class="question-navigation">

                    <button class="previous-button" id="previousButton" type="button">
                        <i class="fa-solid fa-arrow-right"></i>
                        <span>السابق</span>
                    </button>

                    <button class="next-button" id="nextButton" type="button">
                        <span>التالي</span>
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                </div>

            </div>

        </section>


        <!-- ================= PROGRESS ================= -->

        <section class="progress-section">

            <div class="progress-card">

                <div class="progress-top">

                    <span class="progress-percentage" id="progressPercentage">
                        40% مكتمل
                    </span>

                    <span class="question-number" id="questionNumber">
                        السؤال 12 من 30
                    </span>

                </div>


                <div class="progress-bar">

                    <div class="progress-fill" id="progressFill"></div>

                </div>


                <div class="progress-message">
                    ✨ رائع! أنت تتقدم بثبات...
                </div>

            </div>

        </section>

    </main>


    <script>
        /*
         * Temporary questions.
         * Later these will come from the database/API.
         */
        const questions = [
            {
                text: "أجد متعة كبيرة في تحليل البيانات ومعالجة المشكلات الرقمية والمعقدة التي تتطلب تفكيراً منطقياً متسلسلاً.",
                category: "الأسئلة"
            },
            {
                text: "أستمتع بالعمل اليدوي وتصليح الأشياء وفهم كيفية عمل الأدوات والآلات.",
                category: "الأسئلة"
            },
            {
                text: "أشعر بالحماس عندما أتعلم طريقة جديدة لتحليل المعلومات والوصول إلى حل للمشكلة.",
                category: "الأسئلة"
            },
            {
                text: "أفضل العمل مع الآخرين ومساعدتهم على فهم المشكلات والوصول إلى حلول مناسبة.",
                category: "الأسئلة"
            },
            {
                text: "أستمتع بتنظيم المهام والمعلومات ووضع خطة واضحة لإنجاز العمل.",
                category: "الأسئلة"
            },
            {
                text: "أفضل الأعمال التي تمنحني فرصة للإبداع والتعبير عن أفكاري بطريقة مختلفة.",
                category: "الأسئلة"
            }
        ];

        let currentQuestion = 0;
        const answers = {};

        const questionText = document.getElementById("questionText");
        const categoryPill = document.querySelector(".category-pill span");
        const answerOptions = document.querySelectorAll(".answer-option");
        const previousButton = document.getElementById("previousButton");
        const nextButton = document.getElementById("nextButton");
        const questionNumber = document.getElementById("questionNumber");
        const progressPercentage = document.getElementById("progressPercentage");
        const progressFill = document.getElementById("progressFill");

        function renderQuestion() {

            const question = questions[currentQuestion];

            questionText.textContent = question.text;
            categoryPill.textContent = question.category;

            answerOptions.forEach(function (button) {
                const value = Number(button.dataset.value);
                const isSelected = answers[currentQuestion] === value;

                button.classList.toggle("selected", isSelected);
            });

            previousButton.disabled = currentQuestion === 0;

            const progress =
                Math.round(((currentQuestion + 1) / questions.length) * 100);

            questionNumber.textContent =
                `السؤال ${currentQuestion + 1} من ${questions.length}`;

            progressPercentage.textContent =
                `${progress}% مكتمل`;

            progressFill.style.width = `${progress}%`;

            if (currentQuestion === questions.length - 1) {
                nextButton.querySelector("span").textContent = "إنهاء";
            } else {
                nextButton.querySelector("span").textContent = "التالي";
            }
        }

        answerOptions.forEach(function (button) {

            button.addEventListener("click", function () {

                const value = Number(button.dataset.value);

                answers[currentQuestion] = value;

                answerOptions.forEach(function (option) {
                    option.classList.remove("selected");
                });

                button.classList.add("selected");
            });

        });

        nextButton.addEventListener("click", function () {

            if (answers[currentQuestion] === undefined) {
                alert("يرجى اختيار إجابة قبل الانتقال إلى السؤال التالي.");
                return;
            }

            if (currentQuestion < questions.length - 1) {

                currentQuestion++;

                renderQuestion();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });

            } else {

                window.location.href = "results.html";

            }

        });

        previousButton.addEventListener("click", function () {

            if (currentQuestion > 0) {

                currentQuestion--;

                renderQuestion();

            }

        });

        renderQuestion();
    </script>

</body>
</html>
