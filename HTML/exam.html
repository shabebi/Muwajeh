<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اختبار التوجيه | موّجه</title>
    <link rel="icon" type="image/png" href="../LogoIcon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Free -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../CSS/exam.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="top-navigation">

        <a href="index.html" class="logo" aria-label="موّجه">
            <img src="../Logo.png" alt="موّجه">
        </a>

        <nav class="navigation-links" aria-label="التنقل الرئيسي">

            <a href="index.html" class="nav-link">
                الرئيسية
            </a>

            <a href="test.html" class="nav-link active">
                اختبار التوجيه
            </a>

            <a href="universities.html" class="nav-link">
                الجامعات
            </a>

            <a href="majors.html" class="nav-link">
                التخصصات
            </a>

            <a href="about.html" class="nav-link">
                عن المنصة
            </a>

        </nav>

        <div class="auth-header-area">
            <a href="login.html" class="login-button" id="loginButton">
                تسجيل الدخول
            </a>

            <button type="button" class="profile-button" id="profileButton" hidden>
                <i class="fa-solid fa-user"></i>
            </button>
        </div>

        <!-- ACCOUNT POPUP -->
        <div class="account-overlay" id="accountOverlay" hidden>
            <div class="account-popup">

                <button type="button" class="account-close" id="accountClose">
                    ×
                </button>

                <div class="account-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <h2>حسابي</h2>

                <div class="account-info">
                    <div class="account-info-row">
                        <span>الاسم</span>
                        <strong id="accountName">---</strong>
                    </div>

                    <div class="account-info-row">
                        <span>البريد الإلكتروني</span>
                        <strong id="accountEmail">---</strong>
                    </div>
                </div>

                <button type="button" class="logout-button" id="logoutButton">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    تسجيل الخروج
                </button>

            </div>
        </div>

    </header>


    <!-- ================= EXAM ================= -->

    <main class="exam-main">

        <section class="question-card">

            <div class="question-glow"></div>

            <div class="question-container">

                <!-- Category -->
                <div class="category-pill">
                    <span>الأسئلة</span>
                    <i class="fa-regular fa-circle-question"></i>
                </div>


                <!-- Question -->
                <div class="question-heading">

                    <h1 id="questionText">
                        جاري تحميل السؤال...
                    </h1>

                </div>


                <p class="question-description">
                    اختر الدرجة التي تعبّر عن مدى انطباق العبارة عليك.
                </p>


                <!-- Likert -->
                <div class="likert-scale" id="likertScale">

                    <button class="answer-option" type="button" data-value="1">
                        <span class="radio-circle"></span>
                        <span>لا تنطبق إطلاقاً</span>
                    </button>

                    <button class="answer-option" type="button" data-value="2">
                        <span class="radio-circle"></span>
                        <span>لا تنطبق غالباً</span>
                    </button>

                    <button class="answer-option" type="button" data-value="3">
                        <span class="radio-circle"></span>
                        <span>محايد</span>
                    </button>

                    <button class="answer-option" type="button" data-value="4">
                        <span class="radio-circle"></span>
                        <span>تنطبق غالباً</span>
                    </button>

                    <button class="answer-option" type="button" data-value="5">
                        <span class="radio-circle"></span>
                        <span>تنطبق عليّ بشدة</span>
                    </button>

                </div>


                <!-- Navigation -->
                <div class="question-navigation">

                    <button class="previous-button" id="previousButton" type="button">
                        <i class="fa-solid fa-arrow-right"></i>
                        <span>السابق</span>
                    </button>

                    <button class="next-button" id="nextButton" type="button">
                        <span>التالي</span>
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                </div>

            </div>

        </section>


        <!-- ================= PROGRESS ================= -->

        <section class="progress-section">

            <div class="progress-card">

                <div class="progress-top">

                    <span class="progress-percentage" id="progressPercentage">
                        0% مكتمل
                    </span>

                    <span class="question-number" id="questionNumber">
                        السؤال 0 من 0
                    </span>

                </div>


                <div class="progress-bar">

                    <div class="progress-fill" id="progressFill"></div>

                </div>


                <div class="progress-message">
                    ✨ رائع! أنت تتقدم بثبات...
                </div>

            </div>

        </section>

    </main>


    <!-- Exam logic -->
    <script src="../JS/exam.js"></script>
    <script src="../JS/header-auth.js"></script>

</body>

</html>
